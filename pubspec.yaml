name: myhealth_ai
description: "MyHealth AI — Manage health records, appointments, and medical staff with the power of AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (Drift / SQLite)
  drift: ^2.22.1
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: any
  sqlite3: any

  # Models & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: any

  # Notifications
  flutter_local_notifications: any
  timezone: any

  # HTTP / Networking
  dio: ^5.7.0

  # Security
  crypto: ^3.0.6
  flutter_secure_storage: any

  # Files & PDF
  file_picker: any
  path_provider: ^2.1.5
  syncfusion_flutter_pdf: any

  # Utilities
  intl: any
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  google_fonts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
