name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - run: flutter pub get

      # Generated Drift/DAO code (*.g.dart) is already committed, but this
      # keeps the deploy in sync automatically if the schema ever changes.
      - run: dart run build_runner build --delete-conflicting-outputs

      # base-href must match the repo name: a GitHub Pages *project* site
      # (as opposed to a <user>.github.io user site) is served from
      # https://<owner>.github.io/<repo>/, so every asset path the build
      # emits needs that prefix or the deployed page loads a blank screen.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
